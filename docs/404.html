  <style>
    :root {
      color-scheme: dark;
      --spectrum: linear-gradient(90deg, #c38ce8, #90b6f2, #34dfb5, #77e158, #f1b85f, #ff6a5b, #ff9ca9);
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
      margin: 0;
      padding: 32px 16px;
      background: #0b0e1a;
      color: #eef0fa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .paint {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .splat {
      position: absolute;
      aspect-ratio: 1;
    }

    .violet { top: -24vmin; left: -22vmin; width: max(300px, 70vmin); }
    .teal { top: -14vmin; right: -26vmin; width: max(240px, 56vmin); }
    .amber { bottom: -26vmin; left: -20vmin; width: max(260px, 60vmin); }
    .pink { bottom: -30vmin; right: -22vmin; width: max(300px, 72vmin); }
    .blue { top: 40%; left: -9vmin; width: max(120px, 26vmin); }
    .green { top: 34%; right: -7vmin; width: max(100px, 22vmin); }
    .red { top: -5vmin; left: 52%; width: max(80px, 15vmin); }
    .sky { bottom: -3vmin; left: 34%; width: max(80px, 16vmin); }

    main {
      position: relative;
      max-width: 520px;
    }

    .code {
      width: fit-content;
      margin: 0 auto;
      background: var(--spectrum);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-size: clamp(96px, 20vw, 168px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    h1 {
      margin: 12px 0 0;
      font-size: clamp(30px, 6vw, 44px);
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    main p:not(.code) {
      margin: 14px 0 30px;
      color: #a7adc8;
      font-size: 19px;
      line-height: 1.45;
    }

    a {
      display: inline-block;
      padding: 13px 26px;
      border-radius: 999px;
      background: #9184d9;
      color: #0b0e1a;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    a:hover {
      background: #b7adf0;
    }

    a:focus-visible {
      outline: 3px solid #b7adf0;
      outline-offset: 3px;
    }

    /* Each splash lands a beat after the last, as if thrown one by one. */
    @media (prefers-reduced-motion: no-preference) {
      .splat {
        animation: land 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.25) both;
      }

      .teal { animation-delay: 0.08s; }
      .red { animation-delay: 0.16s; }
      .green { animation-delay: 0.22s; }
      .pink { animation-delay: 0.3s; }
      .sky { animation-delay: 0.38s; }
      .amber { animation-delay: 0.44s; }
      .blue { animation-delay: 0.52s; }

      @keyframes land {
        from {
          opacity: 0;
          transform: scale(0.35) rotate(-8deg);
        }
      }
    }

    /* On a phone the words fill the screen, so the paint is centered on the corners and sized by the height left over. */
    @media (max-width: 640px) {
      .splat {
        --s: min(82vw, 42dvh);
        width: var(--s);
      }

      .violet { top: calc(var(--s) * -0.4); left: calc(var(--s) * -0.4); }
      .teal { top: calc(var(--s) * -0.4); right: calc(var(--s) * -0.4); }
      .amber { bottom: calc(var(--s) * -0.4); left: calc(var(--s) * -0.4); }
      .pink { bottom: calc(var(--s) * -0.4); right: calc(var(--s) * -0.4); }

      .blue,
      .green,
      .red,
      .sky {
        display: none;
      }

      main p:not(.code) {
        font-size: 17px;
      }
    }

    @media (max-height: 560px) and (min-width: 641px) {
      .code {
        font-size: min(168px, 26dvh);
      }

      h1 {
        margin-top: 4px;
      }

      main p:not(.code) {
        margin: 10px 0 20px;
      }

      .blue,
      .green,
      .red,
      .sky {
        display: none;
      }
    }
  </style>
