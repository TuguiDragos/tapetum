name: Badges

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      due: ${{ steps.week.outputs.due }}
    steps:
      - name: Every third week, counted from the Unix epoch
        id: week
        run: echo "due=$(( $(date -u +%s) / 604800 % 3 == 0 ))" >> "$GITHUB_OUTPUT"

  refresh:
    needs: cadence
    if: github.event_name == 'workflow_dispatch' || needs.cadence.outputs.due == '1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Read both registries and redraw the badges
        run: node tools/build-badges.mjs

      - name: Commit only if a number moved
        run: |
          for f in readme-assets/badge-vscode.json readme-assets/badge-openvsx.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not written, the generator changed shape"
              exit 1
            fi
          done
          if [ -z "$(git status --porcelain -- readme-assets/badge-vscode.json readme-assets/badge-openvsx.json)" ]; then
            echo "nothing moved"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme-assets/badge-vscode.json readme-assets/badge-openvsx.json
          git commit -m "refresh the download badges" \
            -m "Co-authored-by: Țugui Dragoș <contact@tuguidragos.com>"
          git push
