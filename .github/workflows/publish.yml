name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the managed identity trusts this environment, not a ref, and its variables live here
    environment: vscode-marketplace
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check the tag matches the manifest version
        if: github.event_name == 'release'
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "manifest $manifest, tag $tag"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::package.json says $manifest but the tag says $tag. Bump the version and retag."
            exit 1
          fi

      - name: Verify every theme
        run: node tools/analyze.mjs

      - name: Audit the structure, the schemes and the docs
        run: node tools/audit.mjs

      - name: Deep audit, every theme individually
        run: node tools/deep.mjs

      - name: Compare against the committed snapshot
        run: node tools/snapshot.mjs

      - name: Check the APCA implementation
        run: node tools/apca-check.mjs

      - name: Install the workflow tools from their lockfile
        run: |
          npm ci --prefix .github/tools --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$GITHUB_WORKSPACE/.github/tools/node_modules" >> "$GITHUB_ENV"

      - name: Check that every rule is painted as it says
        run: node tools/paint-check.mjs

      - name: Package
        run: |
          vsce package --no-dependencies -o tapetum.vsix
          ls -l tapetum.vsix

      # global Azure DevOps PATs stop on 1 December 2026; the managed identity takes over once the
      # environment holds its ids, and VSCE_PAT stays the fallback until a release has gone through it
      - name: Sign in to Microsoft Entra ID
        if: vars.AZURE_CLIENT_ID != ''
        # a failed sign in shows in the Marketplace step and must not keep the package from Open VSX
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # the publisher can only add the identity by the ID the Marketplace gives it, and only the identity
      # can ask for it; 499b84ac-1321-427f-aa17-267ca6975798 is Azure DevOps, which the Marketplace runs on.
      # The first run fails with VSS011031 while it creates the profile; a rerun prints the ID
      - name: The ID to add to the Marketplace publisher
        if: github.event_name == 'workflow_dispatch' && vars.AZURE_CLIENT_ID != ''
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

      # fails until that ID is a Contributor on the publisher, so a passing run proves the next release gets through
      - name: The identity can publish as the publisher
        if: github.event_name == 'workflow_dispatch' && vars.AZURE_CLIENT_ID != ''
        run: vsce verify-pat --azure-credential "$(node -p "require('./package.json').publisher")"

      # each registry gets its chance even if the other refuses; the job fails at the end if one did.
      # vsce takes a PAT over --azure-credential, so VSCE_PAT is only set when there is no identity
      - name: Publish to the VS Code Marketplace
        id: marketplace
        if: github.event_name == 'release'
        continue-on-error: true
        env:
          ENTRA_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$ENTRA_CLIENT_ID" ]; then
            vsce publish --packagePath tapetum.vsix --skip-duplicate --azure-credential
          else
            VSCE_PAT="$PAT" vsce publish --packagePath tapetum.vsix --skip-duplicate
          fi

      - name: Publish to Open VSX by trusted publishing
        id: openvsx
        if: github.event_name == 'release'
        continue-on-error: true
        run: ovsx publish tapetum.vsix --skip-duplicate --trusted-publishing

      - name: Attach the package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" tapetum.vsix --clobber

      - name: Fail if a registry refused the package
        if: steps.marketplace.outcome == 'failure' || steps.openvsx.outcome == 'failure'
        env:
          MARKETPLACE: ${{ steps.marketplace.outcome }}
          OPENVSX: ${{ steps.openvsx.outcome }}
        run: |
          echo "::error::Marketplace: $MARKETPLACE, Open VSX: $OPENVSX"
          exit 1
