name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the tag matches the manifest version
        if: github.event_name == 'release'
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "manifest $manifest, tag $tag"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::package.json says $manifest but the tag says $tag. Bump the version and retag."
            exit 1
          fi

      - name: Verify every theme
        run: node tools/analyze.mjs

      - name: Audit the structure, the schemes and the docs
        run: node tools/audit.mjs

      - name: Deep audit, every theme individually
        run: node tools/deep.mjs

      - name: Compare against the committed snapshot
        run: node tools/snapshot.mjs

      - name: Check the APCA implementation
        run: node tools/apca-check.mjs

      - name: Check every TextMate scope still resolves
        run: node tools/scope-audit.mjs

      - name: Package
        run: |
          npx --yes @vscode/vsce@3 package --no-dependencies -o tapetum.vsix
          ls -l tapetum.vsix

      - name: Publish to the VS Code Marketplace
        if: github.event_name == 'release'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3 publish --packagePath tapetum.vsix --skip-duplicate

      - name: Publish to Open VSX
        if: github.event_name == 'release'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1 publish tapetum.vsix --skip-duplicate

      - name: Attach the package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" tapetum.vsix --clobber
