name: Tokens

on:
  schedule:
    - cron: '47 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tokens
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the workflow tools from their lockfile
        run: |
          npm ci --prefix .github/tools --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$GITHUB_WORKSPACE/.github/tools/node_modules" >> "$GITHUB_ENV"

      - name: Read the publisher from the manifest
        id: manifest
        run: echo "publisher=$(node -p "require('./package.json').publisher")" >> "$GITHUB_OUTPUT"

      - name: Ask the Marketplace whether its token can still publish
        id: marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PUBLISHER: ${{ steps.manifest.outputs.publisher }}
        run: vsce verify-pat "$PUBLISHER"

      - name: Open an issue if the token stopped working
        if: steps.marketplace.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER: ${{ steps.manifest.outputs.publisher }}
        run: |
          title="A publishing token stopped working"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            echo "issue already open, still failing"
            exit 1
          fi
          {
            echo "The monthly token check could not publish as $PUBLISHER with VSCE_PAT."
            echo
            echo "A Marketplace token comes from https://dev.azure.com, user settings, personal access tokens, with the Marketplace Manage scope and All accessible organizations, and lives at most 1 year. Azure DevOps stops all such global tokens on 1 December 2026; from then on the Marketplace takes Microsoft Entra ID or its own trusted publishing. Open VSX publishes by trusted publishing and needs no token."
            echo
            echo "Put the new value in the repository settings under Secrets and variables, Actions, then run the Tokens workflow again to confirm. Until then the Publish workflow cannot reach the Marketplace, though Open VSX and the release still get the package."
          } > body.md
          gh issue create --title "$title" --body-file body.md
          exit 1
