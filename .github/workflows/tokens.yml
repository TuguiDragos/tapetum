name: Tokens

on:
  schedule:
    - cron: '47 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: tokens
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the identity's ids are variables of this environment, so the job has to run in it to see them
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the workflow tools from their lockfile
        run: |
          npm ci --prefix .github/tools --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$GITHUB_WORKSPACE/.github/tools/node_modules" >> "$GITHUB_ENV"

      - name: Read the publisher from the manifest
        id: manifest
        run: echo "publisher=$(node -p "require('./package.json').publisher")" >> "$GITHUB_OUTPUT"

      - name: Sign in to Microsoft Entra ID
        # a failed sign in shows in the check below, which opens the issue
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Ask the Marketplace whether the identity can still publish
        id: marketplace
        continue-on-error: true
        env:
          PUBLISHER: ${{ steps.manifest.outputs.publisher }}
        run: vsce verify-pat --azure-credential "$PUBLISHER"

      - name: Open an issue if the Marketplace stopped taking the release
        if: steps.marketplace.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER: ${{ steps.manifest.outputs.publisher }}
        run: |
          title="The Marketplace stopped taking the release"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            echo "issue already open, still failing"
            exit 1
          fi
          {
            echo "The monthly check could not publish as $PUBLISHER with the Microsoft Entra managed identity tapetum-marketplace."
            echo
            echo "Check that the environment vscode-marketplace still holds the variables AZURE_CLIENT_ID and AZURE_TENANT_ID, that the identity still has a federated credential for that environment with the immutable subject GitHub gives this repository (gh api repos/$GITHUB_REPOSITORY/actions/oidc/customization/sub), and that its Marketplace ID is still a Contributor on the publisher's Members page. Running the Publish workflow by hand prints that ID and repeats the check. Open VSX publishes by trusted publishing and needs no token."
            echo
            echo "Then run the Tokens workflow again to confirm. Until then the Publish workflow cannot reach the Marketplace, though Open VSX and the release still get the package."
          } > body.md
          gh issue create --title "$title" --body-file body.md
          exit 1
